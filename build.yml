name: Compilar APK y EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto (project.zip o repo normal)
        run: |
          mkdir _proj
          if [ -f project.zip ]; then python3 -m zipfile -e project.zip _proj; else tar --exclude=./_proj --exclude=./.git -cf - . | tar -xf - -C _proj; fi
          if [ ! -f _proj/package.json ]; then d=$(ls -d _proj/*/ | head -1); mv "$d"* _proj/; fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: _proj/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Instalar dependencias
        working-directory: _proj
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Inicializar Android
        working-directory: _proj
        run: pnpm tauri android init --ci
      - name: Compilar APK (firmado en modo debug, instalable)
        working-directory: _proj
        env:
          NEXT_PUBLIC_NARRATOR_URL: ${{ vars.NARRATOR_URL }}
        run: pnpm tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: OnePieceLifeSimulator-v3.5.0-android-apk
          path: _proj/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto (project.zip o repo normal)
        run: |
          mkdir _proj
          if [ -f project.zip ]; then python -m zipfile -e project.zip _proj; else tar --exclude=./_proj --exclude=./.git -cf - . | tar -xf - -C _proj; fi
          if [ ! -f _proj/package.json ]; then d=$(ls -d _proj/*/ | head -1); mv "$d"* _proj/; fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: _proj/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependencias
        working-directory: _proj
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Compilar instalador de Windows
        working-directory: _proj
        env:
          NEXT_PUBLIC_NARRATOR_URL: ${{ vars.NARRATOR_URL }}
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: OnePieceLifeSimulator-v3.5.0-windows
          path: |
            _proj/src-tauri/target/release/bundle/nsis/*.exe
            _proj/src-tauri/target/release/bundle/msi/*.msi
